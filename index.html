<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思維模型筆記</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<meta name="description" content="能帶來啟發的思維模型、法則與效應，附解析與例子。">
<script src="theme.js"></script>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface-2: #f0ede6;
    --text: #22201c;
    --muted: #6b665c;
    --border: #e2ddd2;
    --accent: #b4532a;
    --accent-soft: #f6e4da;
    --mark: #fbe7a1;
    --shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 2px 8px rgba(40, 30, 10, .04);
  }
  [data-theme="dark"] {
    --bg: #15171a;
    --surface: #1d2024;
    --surface-2: #262a30;
    --text: #e8e6e1;
    --muted: #9b9890;
    --border: #2f343b;
    --accent: #e8875a;
    --accent-soft: #3a2a22;
    --mark: #5a4a1a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.75;
    transition: background .2s, color .2s;
  }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }

  /* 頂部 */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
  .brand .sub { color: var(--muted); font-size: 13px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; height: 36px; padding: 0 14px;
    cursor: pointer; white-space: nowrap; font-size: 14px;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .search-row { display: flex; gap: 8px; padding-bottom: 10px; }
  .search {
    flex: 1; min-width: 0; height: 40px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    padding: 0 14px; font: inherit; color: var(--text); outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .cat-btn { display: none; }

  /* 版面：左側分類清單 + 內容 */
  .layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 32px; align-items: start; }
  .side {
    position: sticky; top: var(--head-h, 120px);
    max-height: calc(100vh - var(--head-h, 120px));
    overflow-y: auto; padding: 20px 0 24px;
    scrollbar-width: thin;
  }
  .side-title {
    font-size: 12px; letter-spacing: .1em; color: var(--muted);
    margin: 8px 12px 8px; font-weight: 700;
  }
  .side-head { display: none; }
  .cats { display: flex; flex-direction: column; gap: 2px; }
  .cat-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    border: none; background: none; text-align: left; cursor: pointer;
    border-radius: 8px; padding: 7px 12px; font-size: 15px; line-height: 1.4;
    border-left: 3px solid transparent;
  }
  .cat-item .label { flex: 1; min-width: 0; }
  .cat-item .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .cat-item:hover { background: var(--surface-2); }
  .cat-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; border-left-color: var(--accent); }
  .cat-item.on .n { color: var(--accent); }
  .cat-item.all { margin-bottom: 2px; }
  .backdrop { display: none; }

  /* 內容 */
  main { padding: 20px 0 80px; min-width: 0; }
  .status { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .section h2 { font-size: 18px; margin: 28px 0 2px; }
  .section .desc { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 10px; box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card.flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%, 40% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } }
  .card summary {
    list-style: none; cursor: pointer; padding: 14px 18px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .card summary::-webkit-details-marker { display: none; }
  .card summary .t { flex: 1; min-width: 0; }
  .card .name { font-weight: 700; font-size: 17px; }
  .card .en { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: 400; }
  .card .gist {
    color: var(--muted); font-size: 14px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card[open] .gist { display: none; }
  .card .arrow {
    flex: none; width: 9px; height: 9px; margin-top: 10px; margin-right: 4px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .2s;
  }
  .card[open] .arrow { transform: rotate(45deg); }
  .fav-btn {
    flex: none; border: none; background: none; cursor: pointer;
    width: 32px; height: 32px; margin: -2px -4px 0 0; border-radius: 8px;
    font-size: 20px; line-height: 1; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
  }
  @media (hover: hover) { .fav-btn:hover { background: var(--surface-2); color: var(--accent); } }
  .fav-btn.on { color: var(--accent); }
  .cat-item.fav-item { margin-bottom: 6px; }
  .body { padding: 0 18px 16px; border-top: 1px dashed var(--border); }
  .part h3 {
    font-size: 13px; letter-spacing: .08em; color: var(--accent);
    margin: 16px 0 4px; font-weight: 700;
  }
  .part p { margin: 0 0 8px; }
  .part ul { margin: 0 0 8px; padding-left: 1.2em; }
  .part li { margin-bottom: 4px; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .tag { background: var(--surface-2); border-radius: 6px; padding: 1px 8px; }
  .copy { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0; }
  .copy:hover { color: var(--accent); }
  a.ref { text-decoration: none; border-bottom: 1px dotted var(--accent); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .empty, .error {
    text-align: center; color: var(--muted); padding: 60px 20px;
  }
  .error code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0 40px; }

  /* 連結面板（桌面：右側堆疊；手機：底部面板） */
  .stack {
    position: fixed; z-index: 20; top: var(--head-h, 120px); right: 0; bottom: 0;
    max-width: calc(100vw - 250px);
    display: none; flex-direction: column;
    background: var(--bg); border-left: 1px solid var(--border);
    box-shadow: -8px 0 28px rgba(0, 0, 0, .18);
  }
  .stack.open { display: flex; animation: stackIn .2s ease; }
  @keyframes stackIn { from { transform: translateX(24px); opacity: 0; } }
  .stack-bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--muted);
  }
  .stack-bar .crumbs { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stack-bar .sbtn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    height: 30px; padding: 0 12px; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .stack-bar .sbtn:hover { border-color: var(--accent); }
  .stack-bar .back { display: none; }
  .stack-track { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; }
  .panel {
    flex: none; width: 420px; height: 100%; overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 16px 20px 40px;
  }
  .panel.flash { animation: flash 1.4s ease; }
  .panel-head { display: flex; gap: 8px; align-items: flex-start; }
  .panel-head .t { flex: 1; min-width: 0; }
  .panel-head .name { font-weight: 700; font-size: 18px; line-height: 1.4; }
  .panel-head .en { color: var(--muted); font-size: 13px; }
  .panel-head .x {
    flex: none; border: none; background: none; cursor: pointer; color: var(--muted);
    width: 32px; height: 32px; border-radius: 8px; font-size: 16px; margin-top: -2px;
  }
  .panel-head .x:hover { background: var(--surface-2); color: var(--text); }
  .panel-meta { display: flex; gap: 12px; align-items: center; margin: 6px 0 4px; font-size: 13px; }
  .panel-meta .goto { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }
  .panel-meta .goto:hover { text-decoration: underline; }
  .spine {
    flex: none; width: 46px; height: 100%; cursor: pointer;
    background: var(--surface-2); border: none; border-right: 1px solid var(--border);
    color: var(--text); font-size: 15px; font-weight: 700; line-height: 1.25;
    padding: 16px 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
  }
  .spine span { display: block; }
  .spine:hover { background: var(--accent-soft); color: var(--accent); }
  .stack-shade { display: none; }

  /* 滑鼠移到連結上的預覽小卡 */
  .peek {
    position: fixed; z-index: 40; width: 320px; display: none; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .18); padding: 12px 14px; font-size: 14px; line-height: 1.6;
  }
  .peek.show { display: block; }
  .peek .name { font-weight: 700; font-size: 15px; }
  .peek .en { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .peek .g { color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .peek .hint { color: var(--accent); font-size: 12px; margin-top: 6px; }

  /* 手機與窄螢幕：分類清單改成左側抽屜 */
  @media (max-width: 860px) {
    .layout { display: block; }
    .cat-btn { display: inline-flex; align-items: center; gap: 6px; max-width: 34%; flex: none; height: 40px; }
    .search-row .icon-btn { height: 40px; }
    .cat-btn .cur { overflow: hidden; text-overflow: ellipsis; }
    .side {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 30;
      width: min(280px, 82vw); max-height: none;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 0 8px 24px;
      transform: translateX(-100%); transition: transform .25s ease;
      box-shadow: 4px 0 24px rgba(0, 0, 0, .15);
      visibility: hidden;
    }
    .side.open { transform: none; visibility: visible; }
    .side-head {
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--surface);
      padding: 14px 4px 10px 12px; margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .side-head strong { font-size: 16px; }
    .side-title { display: none; }
    .cat-item { padding: 10px 12px; font-size: 16px; }
    .backdrop {
      display: block; position: fixed; inset: 0; z-index: 25;
      background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    body.drawer-open, body.sheet-open { overflow: hidden; }

    .stack {
      top: auto; left: 0; right: 0; bottom: 0; height: 85vh; max-width: none;
      border-left: none; border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0; overflow: hidden; z-index: 35;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, .2);
    }
    @keyframes stackIn { from { transform: translateY(40px); opacity: 0; } }
    .stack-bar .back { display: inline-block; }
    .stack-bar .back[hidden] { display: none; }
    .stack-track { overflow-x: hidden; }
    .panel { width: 100%; border-right: none; padding: 14px 16px 40px; }
    .panel:not(:last-child), .spine { display: none; }
    .stack-shade {
      display: block; position: fixed; inset: 0; z-index: 34;
      background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .stack-shade.open { opacity: 1; pointer-events: auto; }
  }

  @media (max-width: 560px) {
    .brand .sub { display: none; }
    .icon-btn { padding: 0 10px; font-size: 13px; }
    .search { padding: 0 10px; }
    .wrap { padding: 0 14px; }
    .card .en { display: block; margin-left: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <h1>思維模型筆記</h1>
        <div class="sub" id="sub">載入中…</div>
      </div>
      <button class="icon-btn" id="randomBtn" title="隨機抽一個概念">🎲 隨機</button>
      <button class="icon-btn" id="themeBtn" title="切換深淺色模式">🌙</button>
    </div>
    <div class="search-row">
      <button class="icon-btn cat-btn" id="catBtn" aria-controls="side" aria-expanded="false">☰ <span class="cur" id="catCur">全部</span></button>
      <input class="search" id="search" type="search" placeholder="搜尋名稱、英文或內容…" autocomplete="off">
      <button class="icon-btn" id="toggleAll">全部展開</button>
    </div>
  </div>
</header>

<div class="layout wrap">
  <aside class="side" id="side" aria-label="分類">
    <div class="side-head"><strong>分類</strong><button class="icon-btn" id="sideClose" aria-label="關閉">✕</button></div>
    <div class="side-title">分類</div>
    <nav class="cats" id="chips"></nav>
  </aside>
  <main>
    <p class="status" id="status"></p>
    <div id="list"></div>
  </main>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="stack-shade" id="stackShade"></div>
<aside class="stack" id="stack" aria-label="概念面板">
  <div class="stack-bar">
    <button class="sbtn back" id="stackBack">← 返回</button>
    <span class="crumbs" id="stackCrumbs"></span>
    <button class="sbtn" id="stackClose">全部關閉</button>
  </div>
  <div class="stack-track" id="stackTrack"></div>
</aside>
<div class="peek" id="peek"></div>

<footer class="wrap">資料位於 <code>data/</code> 資料夾，每個分類一個 JSON 檔。</footer>

<script src="app.js"></script>
</body>
</html>
