<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思維模型筆記</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<meta name="description" content="能帶來啟發的思維模型、法則與效應，附解析與例子。">
<script>
  // 在畫面繪製前套用主題，避免閃爍
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface-2: #f0ede6;
    --text: #22201c;
    --muted: #6b665c;
    --border: #e2ddd2;
    --accent: #b4532a;
    --accent-soft: #f6e4da;
    --mark: #fbe7a1;
    --shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 2px 8px rgba(40, 30, 10, .04);
  }
  [data-theme="dark"] {
    --bg: #15171a;
    --surface: #1d2024;
    --surface-2: #262a30;
    --text: #e8e6e1;
    --muted: #9b9890;
    --border: #2f343b;
    --accent: #e8875a;
    --accent-soft: #3a2a22;
    --mark: #5a4a1a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.75;
    transition: background .2s, color .2s;
  }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }

  /* 頂部 */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
  .brand .sub { color: var(--muted); font-size: 13px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; height: 36px; padding: 0 14px;
    cursor: pointer; white-space: nowrap; font-size: 14px;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .search-row { display: flex; gap: 8px; padding-bottom: 10px; }
  .search {
    flex: 1; min-width: 0; height: 40px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    padding: 0 14px; font: inherit; color: var(--text); outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .cat-btn { display: none; }

  /* 版面：左側分類清單 + 內容 */
  .layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 32px; align-items: start; }
  .side {
    position: sticky; top: var(--head-h, 120px);
    max-height: calc(100vh - var(--head-h, 120px));
    overflow-y: auto; padding: 20px 0 24px;
    scrollbar-width: thin;
  }
  .side-title {
    font-size: 12px; letter-spacing: .1em; color: var(--muted);
    margin: 8px 12px 8px; font-weight: 700;
  }
  .side-head { display: none; }
  .cats { display: flex; flex-direction: column; gap: 2px; }
  .cat-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    border: none; background: none; text-align: left; cursor: pointer;
    border-radius: 8px; padding: 7px 12px; font-size: 15px; line-height: 1.4;
    border-left: 3px solid transparent;
  }
  .cat-item .label { flex: 1; min-width: 0; }
  .cat-item .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .cat-item:hover { background: var(--surface-2); }
  .cat-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; border-left-color: var(--accent); }
  .cat-item.on .n { color: var(--accent); }
  .cat-item.all { margin-bottom: 2px; }
  .backdrop { display: none; }

  /* 內容 */
  main { padding: 20px 0 80px; min-width: 0; }
  .status { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .section h2 { font-size: 18px; margin: 28px 0 2px; }
  .section .desc { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 10px; box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card.flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%, 40% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } }
  .card summary {
    list-style: none; cursor: pointer; padding: 14px 18px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .card summary::-webkit-details-marker { display: none; }
  .card summary .t { flex: 1; min-width: 0; }
  .card .name { font-weight: 700; font-size: 17px; }
  .card .en { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: 400; }
  .card .gist {
    color: var(--muted); font-size: 14px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card[open] .gist { display: none; }
  .card .arrow {
    flex: none; width: 9px; height: 9px; margin-top: 10px; margin-right: 4px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .2s;
  }
  .card[open] .arrow { transform: rotate(45deg); }
  .fav-btn {
    flex: none; border: none; background: none; cursor: pointer;
    width: 32px; height: 32px; margin: -2px -4px 0 0; border-radius: 8px;
    font-size: 20px; line-height: 1; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
  }
  @media (hover: hover) { .fav-btn:hover { background: var(--surface-2); color: var(--accent); } }
  .fav-btn.on { color: var(--accent); }
  .cat-item.fav-item { margin-bottom: 6px; }
  .body { padding: 0 18px 16px; border-top: 1px dashed var(--border); }
  .part h3 {
    font-size: 13px; letter-spacing: .08em; color: var(--accent);
    margin: 16px 0 4px; font-weight: 700;
  }
  .part p { margin: 0 0 8px; }
  .part ul { margin: 0 0 8px; padding-left: 1.2em; }
  .part li { margin-bottom: 4px; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .tag { background: var(--surface-2); border-radius: 6px; padding: 1px 8px; }
  .copy { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0; }
  .copy:hover { color: var(--accent); }
  a.ref { text-decoration: none; border-bottom: 1px dotted var(--accent); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .empty, .error {
    text-align: center; color: var(--muted); padding: 60px 20px;
  }
  .error code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0 40px; }

  /* 連結面板（桌面：右側堆疊；手機：底部面板） */
  .stack {
    position: fixed; z-index: 20; top: var(--head-h, 120px); right: 0; bottom: 0;
    max-width: calc(100vw - 250px);
    display: none; flex-direction: column;
    background: var(--bg); border-left: 1px solid var(--border);
    box-shadow: -8px 0 28px rgba(0, 0, 0, .18);
  }
  .stack.open { display: flex; animation: stackIn .2s ease; }
  @keyframes stackIn { from { transform: translateX(24px); opacity: 0; } }
  .stack-bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--muted);
  }
  .stack-bar .crumbs { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stack-bar .sbtn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    height: 30px; padding: 0 12px; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .stack-bar .sbtn:hover { border-color: var(--accent); }
  .stack-bar .back { display: none; }
  .stack-track { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; }
  .panel {
    flex: none; width: 420px; height: 100%; overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 16px 20px 40px;
  }
  .panel.flash { animation: flash 1.4s ease; }
  .panel-head { display: flex; gap: 8px; align-items: flex-start; }
  .panel-head .t { flex: 1; min-width: 0; }
  .panel-head .name { font-weight: 700; font-size: 18px; line-height: 1.4; }
  .panel-head .en { color: var(--muted); font-size: 13px; }
  .panel-head .x {
    flex: none; border: none; background: none; cursor: pointer; color: var(--muted);
    width: 32px; height: 32px; border-radius: 8px; font-size: 16px; margin-top: -2px;
  }
  .panel-head .x:hover { background: var(--surface-2); color: var(--text); }
  .panel-meta { display: flex; gap: 12px; align-items: center; margin: 6px 0 4px; font-size: 13px; }
  .panel-meta .goto { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }
  .panel-meta .goto:hover { text-decoration: underline; }
  .spine {
    flex: none; width: 46px; height: 100%; cursor: pointer;
    background: var(--surface-2); border: none; border-right: 1px solid var(--border);
    color: var(--text); font-size: 15px; font-weight: 700; line-height: 1.25;
    padding: 16px 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
  }
  .spine span { display: block; }
  .spine:hover { background: var(--accent-soft); color: var(--accent); }
  .stack-shade { display: none; }

  /* 滑鼠移到連結上的預覽小卡 */
  .peek {
    position: fixed; z-index: 40; width: 320px; display: none; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .18); padding: 12px 14px; font-size: 14px; line-height: 1.6;
  }
  .peek.show { display: block; }
  .peek .name { font-weight: 700; font-size: 15px; }
  .peek .en { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .peek .g { color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .peek .hint { color: var(--accent); font-size: 12px; margin-top: 6px; }

  /* 手機與窄螢幕：分類清單改成左側抽屜 */
  @media (max-width: 860px) {
    .layout { display: block; }
    .cat-btn { display: inline-flex; align-items: center; gap: 6px; max-width: 34%; flex: none; height: 40px; }
    .search-row .icon-btn { height: 40px; }
    .cat-btn .cur { overflow: hidden; text-overflow: ellipsis; }
    .side {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 30;
      width: min(280px, 82vw); max-height: none;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 0 8px 24px;
      transform: translateX(-100%); transition: transform .25s ease;
      box-shadow: 4px 0 24px rgba(0, 0, 0, .15);
      visibility: hidden;
    }
    .side.open { transform: none; visibility: visible; }
    .side-head {
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--surface);
      padding: 14px 4px 10px 12px; margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .side-head strong { font-size: 16px; }
    .side-title { display: none; }
    .cat-item { padding: 10px 12px; font-size: 16px; }
    .backdrop {
      display: block; position: fixed; inset: 0; z-index: 25;
      background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    body.drawer-open, body.sheet-open { overflow: hidden; }

    .stack {
      top: auto; left: 0; right: 0; bottom: 0; height: 85vh; max-width: none;
      border-left: none; border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0; overflow: hidden; z-index: 35;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, .2);
    }
    @keyframes stackIn { from { transform: translateY(40px); opacity: 0; } }
    .stack-bar .back { display: inline-block; }
    .stack-bar .back[hidden] { display: none; }
    .stack-track { overflow-x: hidden; }
    .panel { width: 100%; border-right: none; padding: 14px 16px 40px; }
    .panel:not(:last-child), .spine { display: none; }
    .stack-shade {
      display: block; position: fixed; inset: 0; z-index: 34;
      background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .stack-shade.open { opacity: 1; pointer-events: auto; }
  }

  @media (max-width: 560px) {
    .brand .sub { display: none; }
    .icon-btn { padding: 0 10px; font-size: 13px; }
    .search { padding: 0 10px; }
    .wrap { padding: 0 14px; }
    .card .en { display: block; margin-left: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <h1>思維模型筆記</h1>
        <div class="sub" id="sub">載入中…</div>
      </div>
      <button class="icon-btn" id="randomBtn" title="隨機抽一個概念">🎲 隨機</button>
      <button class="icon-btn" id="themeBtn" title="切換深淺色模式">🌙</button>
    </div>
    <div class="search-row">
      <button class="icon-btn cat-btn" id="catBtn" aria-controls="side" aria-expanded="false">☰ <span class="cur" id="catCur">全部</span></button>
      <input class="search" id="search" type="search" placeholder="搜尋名稱、英文或內容…" autocomplete="off">
      <button class="icon-btn" id="toggleAll">全部展開</button>
    </div>
  </div>
</header>

<div class="layout wrap">
  <aside class="side" id="side" aria-label="分類">
    <div class="side-head"><strong>分類</strong><button class="icon-btn" id="sideClose" aria-label="關閉">✕</button></div>
    <div class="side-title">分類</div>
    <nav class="cats" id="chips"></nav>
  </aside>
  <main>
    <p class="status" id="status"></p>
    <div id="list"></div>
  </main>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="stack-shade" id="stackShade"></div>
<aside class="stack" id="stack" aria-label="概念面板">
  <div class="stack-bar">
    <button class="sbtn back" id="stackBack">← 返回</button>
    <span class="crumbs" id="stackCrumbs"></span>
    <button class="sbtn" id="stackClose">全部關閉</button>
  </div>
  <div class="stack-track" id="stackTrack"></div>
</aside>
<div class="peek" id="peek"></div>

<footer class="wrap">資料位於 <code>data/</code> 資料夾，每個分類一個 JSON 檔。</footer>

<script>
(function () {
  'use strict';

  var SECTIONS = [
    ['what', '它是什麼'],
    ['example', '例子'],
    ['why', '為什麼重要'],
    ['howto', '怎麼用']
  ];

  var state = { categories: [], all: [], byId: {}, cat: 'all', q: '', fav: loadFav(), stack: [], start: 0 };
  var PANEL_W = 420, SPINE_W = 46;
  var mobileMQ = window.matchMedia('(max-width: 860px)');
  var hoverMQ = window.matchMedia('(hover: hover) and (min-width: 861px)');

  /* ---------- 收藏（只存在這個瀏覽器的 localStorage） ---------- */
  function loadFav() {
    try {
      var arr = JSON.parse(localStorage.getItem('favorites') || '[]');
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }
  function saveFav() {
    try { localStorage.setItem('favorites', JSON.stringify(Array.from(state.fav))); } catch (e) {}
  }
  function favCount() {
    var n = 0;
    state.fav.forEach(function (id) { if (state.byId[id]) n++; });
    return n;
  }
  function inView(c) {
    return state.cat === 'all' || (state.cat === 'fav' ? state.fav.has(c.id) : c.cat === state.cat);
  }
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 主題 ---------- */
  function applyThemeIcon() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('themeBtn').textContent = dark ? '☀️' : '🌙';
    $('themeBtn').title = dark ? '切換為淺色模式' : '切換為深色模式';
  }
  $('themeBtn').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    applyThemeIcon();
  });
  applyThemeIcon();

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function baseName(n) { return n.replace(/（.*?）/g, '').trim(); }

  // 名稱對照表：用來把文中「某概念」自動連到該卡片
  var nameMap = {};
  function buildNameMap() {
    state.all.forEach(function (c) {
      nameMap[c.name] = c.id;
      nameMap[baseName(c.name)] = c.id;
      var m = c.name.match(/（(.*?)）/);
      if (m) nameMap[m[1]] = c.id;
    });
  }

  // 把一段字串轉成 HTML：以「- 」開頭的行變清單，其餘變段落
  function renderText(text, selfId, q) {
    var lines = String(text).split('\n');
    var html = '', inList = false;
    lines.forEach(function (line) {
      var isItem = /^\s*-\s+/.test(line);
      var content = inline(line.replace(/^\s*-\s+/, ''), selfId, q);
      if (isItem) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + content + '</li>';
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (line.trim()) html += '<p>' + content + '</p>';
      }
    });
    if (inList) html += '</ul>';
    return html;
  }

  function inline(s, selfId, q) {
    var out = esc(s);
    out = out.replace(/「([^「」]+)」/g, function (m, inner) {
      var id = nameMap[inner];
      if (id && id !== selfId) return '「<a class="ref" href="#' + id + '" data-ref="' + id + '">' + inner + '</a>」';
      return m;
    });
    return highlight(out, q);
  }

  function highlight(html, q) {
    if (!q) return html;
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    // 只替換標籤之外的文字
    return html.replace(/(<[^>]+>)|([^<]+)/g, function (m, tag, txt) {
      return tag ? tag : txt.replace(re, '<mark>$1</mark>');
    });
  }

  function gist(c) {
    var first = c.what.split('\n')[0];
    return first.replace(/^\s*-\s+/, '');
  }

  /* ---------- 載入資料 ---------- */
  function load() {
    fetch('data/categories.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (idx) {
        state.categories = idx.categories;
        return Promise.all(idx.categories.map(function (cat) {
          return fetch('data/' + cat.file, { cache: 'no-cache' })
            .then(function (r) { if (!r.ok) throw new Error(cat.file + ' ' + r.status); return r.json(); })
            .then(function (items) {
              cat.items = items;
              items.forEach(function (it) { it.cat = cat.id; it.catName = cat.name; });
            });
        }));
      })
      .then(function () {
        state.categories.forEach(function (c) { state.all = state.all.concat(c.items); });
        state.all.forEach(function (c) { state.byId[c.id] = c; });
        buildNameMap();
        $('sub').textContent = '共 ' + state.all.length + ' 個概念 · ' + state.categories.length + ' 個分類';
        renderChips();
        render();
        openFromHash();
      })
      .catch(function (err) {
        $('list').innerHTML = '<div class="error">資料載入失敗（' + esc(err.message) + '）。<br>' +
          '如果你是直接用瀏覽器開啟本機檔案，請改用本機伺服器，例如在資料夾中執行 <code>python3 -m http.server</code>。</div>';
        $('sub').textContent = '載入失敗';
      });
  }

  /* ---------- 畫面 ---------- */
  function renderChips() {
    var html = '<button class="cat-item all' + (state.cat === 'all' ? ' on' : '') + '" data-cat="all"><span class="label">全部</span><span class="n">' + state.all.length + '</span></button>';
    html += '<button class="cat-item fav-item' + (state.cat === 'fav' ? ' on' : '') + '" data-cat="fav"><span class="label">★ 我的收藏</span><span class="n">' + favCount() + '</span></button>';
    var cur = state.cat === 'fav' ? '★ 收藏' : '全部';
    state.categories.forEach(function (c) {
      if (state.cat === c.id) cur = c.name;
      html += '<button class="cat-item' + (state.cat === c.id ? ' on' : '') + '" data-cat="' + c.id + '" title="' + esc(c.description || '') + '"><span class="label">' + esc(c.name) + '</span><span class="n">' + c.items.length + '</span></button>';
    });
    $('chips').innerHTML = html;
    $('catCur').textContent = cur;
  }

  function matches(c, q) {
    if (!q) return true;
    var hay = [c.name, c.en, c.what, c.example, c.why, c.howto].join(' ').toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }

  function cardHTML(c, q) {
    var body = SECTIONS.map(function (s) {
      return '<div class="part"><h3>' + s[1] + '</h3>' + renderText(c[s[0]], c.id, q) + '</div>';
    }).join('');
    return '<details class="card" id="' + c.id + '">' +
      '<summary><div class="t"><div><span class="name">' + highlight(esc(c.name), q) + '</span>' +
      '<span class="en">' + highlight(esc(c.en || ''), q) + '</span></div>' +
      '<div class="gist">' + highlight(esc(gist(c)), q) + '</div></div>' +
      favBtnHTML(c.id) +
      '<span class="arrow"></span></summary>' +
      '<div class="body">' + body +
      '<div class="card-foot"><span class="tag">' + esc(c.catName) + '</span>' +
      '<button class="copy" data-copy="' + c.id + '">複製連結</button></div>' +
      '</div></details>';
  }

  function favBtnHTML(id) {
    var on = state.fav.has(id);
    return '<button class="fav-btn' + (on ? ' on' : '') + '" data-fav="' + id + '" aria-pressed="' + on + '" title="' + (on ? '取消收藏' : '收藏') + '">' + (on ? '★' : '☆') + '</button>';
  }

  /* ---------- 連結面板 ---------- */
  function panelHTML(c, i) {
    var body = SECTIONS.map(function (s) {
      return '<div class="part"><h3>' + s[1] + '</h3>' + renderText(c[s[0]], c.id, '') + '</div>';
    }).join('');
    return '<section class="panel" data-idx="' + i + '" data-id="' + c.id + '">' +
      '<div class="panel-head"><div class="t"><div class="name">' + esc(c.name) + '</div>' +
      '<div class="en">' + esc(c.en || '') + '</div></div>' +
      favBtnHTML(c.id) +
      '<button class="x" data-close="' + i + '" title="關閉">✕</button></div>' +
      '<div class="panel-meta"><span class="tag">' + esc(c.catName) + '</span>' +
      '<button class="goto" data-goto="' + c.id + '">在列表中查看</button></div>' +
      body + '</section>';
  }

  // 桌面版：算出畫面放得下幾個展開的面板，其餘縮成窄邊
  function expandedCount(n) {
    var avail = window.innerWidth - 250;
    var k = n;
    while (k > 1 && k * PANEL_W + (n - k) * SPINE_W > avail) k--;
    return k;
  }

  function renderStack(focusIdx) {
    var n = state.stack.length;
    var el = $('stack');
    if (!n) {
      el.classList.remove('open');
      $('stackShade').classList.remove('open');
      document.body.classList.remove('sheet-open');
      $('stackTrack').innerHTML = '';
      return;
    }
    var k = mobileMQ.matches ? n : expandedCount(n);
    if (focusIdx == null) focusIdx = n - 1;
    var start = Math.min(state.start, n - k);
    if (focusIdx < start) start = focusIdx;
    if (focusIdx > start + k - 1) start = focusIdx - k + 1;
    state.start = Math.max(0, start);
    var html = '';
    state.stack.forEach(function (id, i) {
      var c = state.byId[id];
      if (i >= state.start && i < state.start + k) html += panelHTML(c, i);
      else html += '<button class="spine" data-spine="' + i + '" title="' + esc(c.name) + '">' + Array.from(baseName(c.name)).map(function (ch) { return '<span>' + esc(ch) + '</span>'; }).join('') + '</button>';
    });
    $('stackTrack').innerHTML = html;
    $('stackCrumbs').textContent = state.stack.map(function (id) { return baseName(state.byId[id].name); }).join(' › ');
    $('stackBack').hidden = n < 2;
    el.classList.add('open');
    if (mobileMQ.matches) {
      $('stackShade').classList.add('open');
      document.body.classList.add('sheet-open');
    }
    var target = $('stackTrack').querySelector('.panel[data-idx="' + focusIdx + '"]');
    var track = $('stackTrack');
    if (target) {
      // 只在面板區塊內左右捲動，不動到整個頁面
      var l = target.offsetLeft, r = l + target.offsetWidth;
      if (r > track.scrollLeft + track.clientWidth) track.scrollLeft = r - track.clientWidth;
      if (l < track.scrollLeft) track.scrollLeft = l;
    }
  }

  function flashPanel(i) {
    var p = $('stackTrack').querySelector('.panel[data-idx="' + i + '"]');
    if (!p) return;
    p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash');
  }

  // fromIdx：從第幾個面板點出來的；-1 代表從列表點的
  function openRef(id, fromIdx) {
    hidePeek();
    var at = state.stack.indexOf(id);
    if (at !== -1) { renderStack(at); flashPanel(at); return; }
    state.stack = state.stack.slice(0, fromIdx + 1).concat(id);
    state.start = state.stack.length; // 讓最新的面板靠右
    renderStack(state.stack.length - 1);
    var p = $('stackTrack').querySelector('.panel[data-idx="' + (state.stack.length - 1) + '"]');
    if (p) p.scrollTop = 0;
  }

  function closeStack() { state.stack = []; state.start = 0; renderStack(); }

  /* ---------- 預覽小卡（只在有滑鼠的桌面） ---------- */
  var peekTimer = null;
  function hidePeek() { clearTimeout(peekTimer); $('peek').classList.remove('show'); }
  function showPeek(a) {
    var c = state.byId[a.getAttribute('data-ref')]; if (!c) return;
    var pk = $('peek');
    pk.innerHTML = '<span class="name">' + esc(c.name) + '</span><span class="en">' + esc(c.en || '') + '</span>' +
      '<div class="g">' + esc(gist(c)) + '</div><div class="hint">點一下在旁邊展開</div>';
    pk.classList.add('show');
    var r = a.getBoundingClientRect(), w = pk.offsetWidth, h = pk.offsetHeight;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    var top = r.bottom + 8;
    if (top + h > window.innerHeight - 8) top = r.top - h - 8;
    pk.style.left = left + 'px'; pk.style.top = Math.max(8, top) + 'px';
  }
  document.addEventListener('mouseover', function (e) {
    if (!hoverMQ.matches) return;
    var a = e.target.closest && e.target.closest('a.ref');
    if (!a) return;
    clearTimeout(peekTimer);
    peekTimer = setTimeout(function () { showPeek(a); }, 250);
  });
  document.addEventListener('mouseout', function (e) {
    var a = e.target.closest && e.target.closest('a.ref');
    if (a && !a.contains(e.relatedTarget)) hidePeek();
  });
  window.addEventListener('scroll', hidePeek, true);

  function render() {
    var q = state.q.trim();
    var html = '', count = 0;
    state.categories.forEach(function (cat) {
      var items = cat.items.filter(function (c) { return inView(c) && matches(c, q); });
      if (!items.length) return;
      count += items.length;
      html += '<section class="section"><h2>' + esc(cat.name) + '</h2>' +
        (cat.description ? '<p class="desc">' + esc(cat.description) + '</p>' : '') +
        items.map(function (c) { return cardHTML(c, q); }).join('') + '</section>';
    });
    var empty = q ? '找不到符合「' + esc(q) + '」的概念。'
      : (state.cat === 'fav' ? '還沒有收藏。點卡片右上角的 ☆ 就能收藏。<br>收藏只存在這個瀏覽器，清除網站資料後就會消失。' : '這個分類還沒有概念。');
    $('list').innerHTML = html || '<div class="empty">' + empty + '</div>';
    $('status').textContent = q ? '找到 ' + count + ' 個結果' : '';
    // 搜尋時自動展開結果較少的卡片
    if (q && count <= 5) document.querySelectorAll('.card').forEach(function (d) { d.open = true; });
    updateToggleLabel();
  }

  function updateToggleLabel() {
    var cards = document.querySelectorAll('.card');
    var allOpen = cards.length && Array.prototype.every.call(cards, function (d) { return d.open; });
    $('toggleAll').textContent = allOpen ? '全部收合' : '全部展開';
  }

  function focusCard(id, instant) {
    var el = document.getElementById(id);
    if (!el) {
      // 不在目前篩選範圍內：清除篩選後再找
      state.cat = 'all'; state.q = ''; $('search').value = '';
      renderChips(); render();
      el = document.getElementById(id);
      if (!el) return;
    }
    el.open = true;
    var headerH = document.querySelector('header.top').offsetHeight;
    var top = el.getBoundingClientRect().top + window.pageYOffset - headerH - 12;
    window.scrollTo({ top: top, behavior: instant ? 'auto' : 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    updateToggleLabel();
  }

  function openFromHash() {
    var id = decodeURIComponent(location.hash.slice(1));
    if (id && state.byId[id]) focusCard(id, true);
  }

  /* ---------- 事件 ---------- */
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.cat-item'); if (!b) return;
    state.cat = b.getAttribute('data-cat');
    renderChips(); render();
    setDrawer(false);
    window.scrollTo({ top: 0 });
  });

  // 手機版抽屜
  function setDrawer(open) {
    $('side').classList.toggle('open', open);
    $('backdrop').classList.toggle('open', open);
    document.body.classList.toggle('drawer-open', open);
    $('catBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  $('catBtn').addEventListener('click', function () { setDrawer(true); });
  $('sideClose').addEventListener('click', function () { setDrawer(false); });
  $('backdrop').addEventListener('click', function () { setDrawer(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setDrawer(false); });

  // 讓側欄黏在頂部列下方
  function syncHeadHeight() {
    document.documentElement.style.setProperty('--head-h', document.querySelector('header.top').offsetHeight + 'px');
  }
  window.addEventListener('resize', syncHeadHeight);
  syncHeadHeight();

  var timer;
  $('search').addEventListener('input', function (e) {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = e.target.value; render(); }, 150);
  });

  $('toggleAll').addEventListener('click', function () {
    var cards = document.querySelectorAll('.card');
    var allOpen = Array.prototype.every.call(cards, function (d) { return d.open; });
    cards.forEach(function (d) { d.open = !allOpen; });
    updateToggleLabel();
  });

  $('randomBtn').addEventListener('click', function () {
    var pool = state.all.filter(inView);
    if (!pool.length) return;
    var c = pool[Math.floor(Math.random() * pool.length)];
    document.querySelectorAll('.card[open]').forEach(function (d) { d.open = false; });
    history.replaceState(null, '', '#' + c.id);
    focusCard(c.id);
  });

  // 星號與概念連結：列表和面板共用
  document.addEventListener('click', function (e) {
    var fb = e.target.closest('.fav-btn');
    if (fb) {
      e.preventDefault(); // 不要順便展開或收合卡片
      var id = fb.getAttribute('data-fav');
      if (state.fav.has(id)) state.fav.delete(id); else state.fav.add(id);
      saveFav();
      renderChips();
      document.querySelectorAll('.fav-btn[data-fav="' + id + '"]').forEach(function (b) { b.outerHTML = favBtnHTML(id); });
      if (state.cat === 'fav' && !state.fav.has(id)) render();
      return;
    }
    var ref = e.target.closest('a.ref');
    if (ref) {
      e.preventDefault();
      var panel = ref.closest('.panel');
      openRef(ref.getAttribute('data-ref'), panel ? +panel.getAttribute('data-idx') : -1);
    }
  });

  $('stackTrack').addEventListener('click', function (e) {
    var x = e.target.closest('[data-close]');
    if (x) {
      var i = +x.getAttribute('data-close');
      state.stack.splice(i, 1);
      renderStack(Math.min(i, state.stack.length - 1));
      return;
    }
    var sp = e.target.closest('[data-spine]');
    if (sp) { var j = +sp.getAttribute('data-spine'); renderStack(j); flashPanel(j); return; }
    var g = e.target.closest('[data-goto]');
    if (g) {
      var id = g.getAttribute('data-goto');
      closeStack();
      history.replaceState(null, '', '#' + id);
      focusCard(id);
    }
  });
  $('stackClose').addEventListener('click', closeStack);
  $('stackShade').addEventListener('click', closeStack);
  $('stackBack').addEventListener('click', function () {
    state.stack.pop();
    renderStack();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { hidePeek(); closeStack(); } });
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (state.stack.length) renderStack(); }, 120);
  });

  $('list').addEventListener('click', function (e) {
    var cp = e.target.closest('.copy');
    if (cp) {
      var url = location.href.split('#')[0] + '#' + cp.getAttribute('data-copy');
      var done = function () { cp.textContent = '已複製 ✓'; setTimeout(function () { cp.textContent = '複製連結'; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt('複製這個連結：', url); });
      else prompt('複製這個連結：', url);
    }
  });

  $('list').addEventListener('toggle', updateToggleLabel, true);
  window.addEventListener('hashchange', openFromHash);

  load();
})();
</script>
</body>
</html>
